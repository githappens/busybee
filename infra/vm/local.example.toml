# Local configuration for the VM lab controller (scripts/vm/vmctl.py).
# Copy to build/vm/local.toml (ignored) and adjust. Machine-specific values,
# VM and snapshot identities belong there, never in this file.
schema = 1

# Controller state, worker registry and run evidence. Must stay inside build/vm/.
state_dir = "build/vm"

# How workers are cloned from a baseline snapshot: "linked" or "full". There is
# no automatic switch; doctor reports a mode the baseline did not validate.
clone_strategy = "linked"

# Optional absolute tool paths. Without them the controller uses PATH, then the
# Parallels Desktop app bundle, and reports which one it chose.
[parallels]
# prlctl = "/path/to/prlctl"
# prlsrvctl = "/path/to/prlsrvctl"

# Seconds. Finite and nested: command <= scenario <= run. Cleanup is the
# separate window for collecting diagnostics after a timeout or cancellation.
[deadlines]
command = 1800
scenario = 3600
run = 14400
cleanup = 300

# Total resources all active workers may use.
[budget]
cpus = 4
memory_mib = 8192
storage_gib = 64

# One worker's allocation, within the budget. One worker is active at a time;
# storage_gib must cover the baseline's disk (16 GiB), which a clone can grow to.
# artifact_mib caps the host storage one run's logs and evidence may use; a
# command that outgrows it is stopped with an explicit failure.
[worker]
cpus = 4
memory_mib = 8192
storage_gib = 16
artifact_mib = 2048

# Baselines, by guest OS. Each manifest path is relative to state_dir and is
# written by template promotion (busybee.vm.template/v2).
[templates.linux]
manifest = "templates/linux/manifest.json"

# macOS guests boot only from full clones (APFS makes them copy-on-write), and
# the lab leases one long-lived macOS guest instead of cloning per run.
# `template build macos` clones `source`, an operator-prepared macOS VM (Nix,
# SSH, passwordless sudo for `user`), which the controller first reaches with
# `bootstrap_key` (relative to state_dir) and then never again.
[templates.macos]
manifest = "templates/macos/manifest.json"
clone_strategy = "full"
# source = "<your prepared macOS VM>"
# user = "<its lab account>"
# bootstrap_key = "keys/<private key authorized for that account>"
