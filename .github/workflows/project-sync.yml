# Mirror sortie's label-driven issue states onto the project board's Status
# column. Sortie (the agent orchestrator) moves issues through
# sortie:ready -> sortie:working -> sortie:review -> sortie:done by label;
# GitHub Projects can only show columns from a single-select field, so this
# workflow keeps the two in step.
#
# Requires a repository secret PROJECT_TOKEN: a fine-grained PAT with
# "Projects: read and write" on the project owner (the default GITHUB_TOKEN
# cannot access user-owned Projects v2).
name: project-sync

on:
  issues:
    types: [opened, labeled, unlabeled, closed, reopened]

permissions:
  issues: read

env:
  PROJECT_OWNER: githappens
  PROJECT_NUMBER: 2

concurrency:
  group: project-sync-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Any sortie state label (the marker label is absent on blocked issues).
    if: contains(join(github.event.issue.labels.*.name, ','), 'sortie')
    steps:
      - name: Map labels to Status and update the board
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          STATE: ${{ github.event.issue.state }}
        run: |
          set -euo pipefail
          has() { case ",$LABELS," in *",$1,"*) return 0;; *) return 1;; esac; }
          if   has needs-human;     then status=Blocked
          elif has sortie:done;     then status=Done
          elif [ "$STATE" = closed ]; then status=Done
          elif has sortie:review;   then status=Review
          elif has sortie:working;  then status=Working
          elif has sortie:ready;    then status=Ready
          else echo "no sortie state label; leaving Status unchanged"; exit 0
          fi
          echo "target status: $status"

          # All GraphQL via `viewer` (the token's own user): a classic PAT with
          # only the `project` scope is enough, and no owner-type lookup is needed.
          meta=$(gh api graphql -F n="$PROJECT_NUMBER" -f query='
            query($n: Int!) { viewer { projectV2(number: $n) { id
              field(name: "Status") { ... on ProjectV2SingleSelectField { id options { id name } } } } } }')
          project_id=$(jq -r '.data.viewer.projectV2.id' <<<"$meta")
          field_id=$(jq -r '.data.viewer.projectV2.field.id' <<<"$meta")
          option_id=$(jq -r --arg s "$status" '.data.viewer.projectV2.field.options[] | select(.name==$s) | .id' <<<"$meta")
          [ -n "$project_id" ] && [ "$project_id" != null ] || { echo "project $PROJECT_NUMBER not found for token owner" >&2; exit 1; }
          [ -n "$option_id" ] || { echo "Status option '$status' not found on the project" >&2; exit 1; }

          # addProjectV2ItemById is idempotent: returns the existing item if present.
          item_id=$(gh api graphql -f p="$project_id" -f c="$ISSUE_NODE_ID" -f query='
            mutation($p: ID!, $c: ID!) { addProjectV2ItemById(input: {projectId: $p, contentId: $c}) { item { id } } }' \
            --jq '.data.addProjectV2ItemById.item.id')
          gh api graphql -f p="$project_id" -f i="$item_id" -f f="$field_id" -f o="$option_id" -f query='
            mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
              updateProjectV2ItemFieldValue(input: {projectId: $p, itemId: $i, fieldId: $f, value: {singleSelectOptionId: $o}}) { projectV2Item { id } } }' >/dev/null
          echo "$ISSUE_URL -> $status"
