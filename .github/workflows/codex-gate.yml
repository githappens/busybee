# Turn Codex's automated review into a review decision the orchestrator can act
# on. Codex (chatgpt-codex-connector[bot]) posts comment-only reviews; this job
# reads the latest Codex review for the PR's head commit and submits, as
# github-actions[bot], REQUEST_CHANGES when it carries any inline finding and
# APPROVE when it carries none (a clean re-review after a push is the merge
# signal). With a ruleset requiring one approval on main,
# that is what moves `reviewDecision` from REVIEW_REQUIRED to APPROVED.
#
# Reviews submitted by the Codex app have been observed not to fire the
# pull_request_review trigger, so a schedule sweeps every open PR; the event
# triggers only make it faster when they do fire. Evaluation is idempotent.
#
# Requires the repository setting "Allow GitHub Actions to create and approve
# pull requests" (Settings → Actions → General → Workflow permissions).
name: codex-gate

on:
  schedule:
    - cron: "*/5 * * * *"
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate (empty = all open PRs)
        required: false

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: codex-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ONLY_PR: ${{ github.event.pull_request.number || inputs.pr }}
      REVIEWER: chatgpt-codex-connector[bot]
    steps:
      - name: Evaluate the latest Codex review for each PR head
        run: |
          set -euo pipefail
          if [ -n "$ONLY_PR" ]; then
            prs="$ONLY_PR"
          else
            prs=$(gh pr list --repo "$REPO" --state open --limit 100 --json number --jq '.[].number')
          fi
          for PR in $prs; do
            export HEAD=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
            echo "== PR #$PR head $HEAD"

            review_id=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
              --jq '[.[] | select(.user.login==env.REVIEWER and .commit_id==env.HEAD)] | sort_by(.submitted_at) | last | .id // empty')
            if [ -z "$review_id" ]; then
              echo "   no Codex review for this head yet"
              continue
            fi

            # Any inline finding blocks; Codex only posts what it considers worth fixing.
            findings=$(gh api "repos/$REPO/pulls/$PR/reviews/$review_id/comments" --paginate --jq 'length')
            mine=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
              --jq '[.[] | select(.user.login=="github-actions[bot]" and .commit_id==env.HEAD)] | sort_by(.submitted_at) | last | .state // empty')
            echo "   codex review $review_id: $findings finding(s); gate so far: ${mine:-none}"

            if [ "$findings" -gt 0 ]; then
              [ "$mine" = "CHANGES_REQUESTED" ] && continue
              gh api -X POST "repos/$REPO/pulls/$PR/reviews" -f event=REQUEST_CHANGES -f commit_id="$HEAD" \
                -f body="codex-gate: Codex left $findings finding(s) on $HEAD. Fix each one, or reply on its thread with why it does not apply, then push; the gate re-evaluates on the next Codex review." >/dev/null
              echo "   -> REQUEST_CHANGES"
            else
              [ "$mine" = "APPROVED" ] && continue
              gh api -X POST "repos/$REPO/pulls/$PR/reviews" -f event=APPROVE -f commit_id="$HEAD" \
                -f body="codex-gate: Codex review $review_id on $HEAD reports no findings." >/dev/null
              echo "   -> APPROVE"
            fi
          done
