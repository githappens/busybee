# Merge gate: turn Codex's automated review into a review decision.
#
# Codex (chatgpt-codex-connector[bot]) reviews every push but never approves or
# requests changes. With findings it posts a review pinned to the head commit;
# with nothing to flag it reacts 👍 on the PR (automatic review) or posts a
# "no major issues" comment (manual @codex review). This workflow
#
#   1. selects (deterministically) the open PRs where Codex has said something
#      about the current head commit that the gate has not yet judged,
#   2. has a small Claude model read that material and decide APPROVE,
#      REQUEST_CHANGES, or UNSURE (the model never holds the review token), and
#   3. posts the verdict as github-actions[bot]. UNSURE posts nothing, so the
#      PR waits for a human instead of the gate guessing.
#
# Severity policy. Codex tags each finding P0/P1/P2 (P3 exists in principle).
# Only P0/P1 block, and a block lifts only on a later clean Codex signal for
# the head. A P2/P3 finding is a follow-up, not a blocker: the head is approved
# once the author has answered every such thread with a reason (out of scope,
# not applicable, follow-up issue filed). An audit of 49 findings over four PRs
# found every would-have-shipped bug in rounds 1-2 and the P2 tail to be
# cascades from earlier fixes and edge-of-edge cases, one per round, because
# Codex surfaces one or two findings per pass; blocking on them turned a
# 2-round review into 11.
#
# With the ruleset on main requiring one approval (dismissed on push), the
# verdict is what moves `reviewDecision`, which the orchestrator's auto-merge
# reads. Requires the repository setting "Allow GitHub Actions to create and
# approve pull requests" and the CLAUDE_CODE_OAUTH_TOKEN secret.
name: codex-gate

on:
  schedule:
    - cron: "*/5 * * * *"
  pull_request:
    types: [synchronize]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate (empty = all open PRs)
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: codex-gate
  cancel-in-progress: false

env:
  REVIEWER: chatgpt-codex-connector[bot]
  GATE: github-actions[bot]

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.pick.outputs.prs }}
    steps:
      - name: Find PRs with unjudged Codex activity on their head commit
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Only a manual dispatch narrows to one PR. Event runs evaluate every open
          # PR: a clean Codex verdict is a reaction, which raises no event of its own,
          # and the cron trigger is throttled on quiet repositories.
          ONLY_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          if [ -n "$ONLY_PR" ] && gh api "repos/$REPO/pulls/$ONLY_PR" --jq .state 2>/dev/null | grep -q open; then
            prs="$ONLY_PR"
          else
            prs=$(gh pr list --repo "$REPO" --state open --limit 100 --json number --jq '.[].number')
          fi
          picked=()
          for PR in $prs; do
            export HEAD=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
            export HEAD_DATE=$(gh api "repos/$REPO/commits/$HEAD" --jq .commit.committer.date)
            reviews=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate)
            codex_at=$(jq -r '[.[] | select(.user.login==env.REVIEWER and .commit_id==env.HEAD) | .submitted_at] | max // empty' <<<"$reviews")
            comment_at=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
              --jq '[.[] | select(.user.login==env.REVIEWER and .created_at > env.HEAD_DATE) | .created_at] | max // empty')
            # Reactions and comments are not pinned to a commit: a clean verdict for
            # the previous push can arrive after the next push. Count them only once
            # the head is old enough for any in-flight review to have finished and
            # Codex shows no 👀 (it keeps 👀 while reviewing). Findings-reviews are
            # pinned to the head and count immediately.
            reactions=$(gh api "repos/$REPO/issues/$PR/reactions" --paginate)
            eyes=$(jq '[.[] | select(.user.login==env.REVIEWER and .content=="eyes")] | length' <<<"$reactions")
            age=$(( $(date +%s) - $(date -d "$HEAD_DATE" +%s) ))
            reaction_at=""
            if [ "$eyes" -eq 0 ] && [ "$age" -ge 480 ]; then
              reaction_at=$(jq -r '[.[] | select(.user.login==env.REVIEWER and .content != "eyes" and .created_at > env.HEAD_DATE) | .created_at] | max // empty' <<<"$reactions")
            else
              comment_at=""
            fi
            # An author reply on a finding's thread can resolve a P2/P3 finding,
            # so it re-opens the judgement — but only once Codex has reviewed this
            # head; before that there is nothing to judge the reply against.
            reply_at=""
            if [ -n "$codex_at" ]; then
              export AUTHOR=$(gh api "repos/$REPO/pulls/$PR" --jq .user.login)
              reply_at=$(gh api "repos/$REPO/pulls/$PR/comments" --paginate \
                --jq '[.[] | select(.user.login==env.AUTHOR and .in_reply_to_id != null and .created_at > env.HEAD_DATE) | .created_at] | max // empty')
            fi
            latest=$(printf '%s\n%s\n%s\n%s\n' "$codex_at" "$comment_at" "$reaction_at" "$reply_at" | sort | tail -1)
            gate_at=$(jq -r '[.[] | select(.user.login==env.GATE and .commit_id==env.HEAD) | .submitted_at] | max // empty' <<<"$reviews")
            if [ -n "$latest" ] && { [ -z "$gate_at" ] || [[ "$latest" > "$gate_at" ]]; }; then
              echo "PR #$PR: Codex activity at $latest, last verdict ${gate_at:-none} -> judge"
              picked+=("$PR")
            elif [ -z "$latest" ]; then
              # No Codex signal for this head; wait for one. The gate cannot ask
              # for a review itself: Codex only answers a mention from an account
              # linked to it, and refuses one from github-actions[bot] with "create
              # a Codex account and connect to github". The author's own agent asks
              # when it needs to (sortie/WORKFLOW.md), posting as a linked user.
              echo "PR #$PR: waiting for Codex (head ${age}s old)"
            else
              echo "PR #$PR: nothing new (codex $latest, verdict ${gate_at:-none})"
            fi
          done
          printf 'prs=%s\n' "$(printf '%s\n' "${picked[@]:-}" | grep -v '^$' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  judge:
    needs: select
    if: needs.select.outputs.prs != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.select.outputs.prs) }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ matrix.pr }}
    steps:
      - uses: actions/checkout@v5

      - name: Collect the review material for the head commit
        run: |
          set -euo pipefail
          mkdir -p gate
          export HEAD=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          export HEAD_DATE=$(gh api "repos/$REPO/commits/$HEAD" --jq .commit.committer.date)
          {
            echo "# PR #$PR — review material for head $HEAD (committed $HEAD_DATE)"
            echo
            gh api "repos/$REPO/pulls/$PR" --jq '"Title: \(.title)\nAuthor: \(.user.login)\nBranch: \(.head.ref) -> \(.base.ref)\n\n## PR description\n\(.body // "(none)")"'
            echo
            echo "## Codex reviews pinned to this head (newest last)"
            gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
              --jq '[.[] | select(.user.login==env.REVIEWER and .commit_id==env.HEAD)] | sort_by(.submitted_at) | .[] | "\n### review \(.id) at \(.submitted_at) state=\(.state)\n\(.body)"'
            echo
            # A finding belongs to this head when its review is pinned here; the
            # comment's own commit_id drifts to the newest commit its line survives
            # in, so it cannot be used. The priority is the badge in the body.
            echo "## Codex findings on this head, with priority and the author's replies"
            export AUTHOR=$(gh api "repos/$REPO/pulls/$PR" --jq .user.login)
            export REVIEW_IDS=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
              --jq '[.[] | select(.user.login==env.REVIEWER and .commit_id==env.HEAD) | .id]' | jq -sc add)
            gh api "repos/$REPO/pulls/$PR/comments" --paginate | jq -s add | jq -r '
              (env.REVIEW_IDS | fromjson) as $reviews
              | . as $all
              | [ .[] | select(.user.login==env.REVIEWER and .in_reply_to_id==null and (.pull_request_review_id as $r | $reviews | index($r) != null)) ]
              | sort_by(.created_at)
              | if length == 0 then "- (none: no findings-review is pinned to this head)" else
                .[] | . as $f
                | (($f.body | capture("badge/(?<p>P[0-9])") | .p) // "unbadged") as $p
                | ($f.body | split("\n") | map(select(length > 0)) | .[0] | gsub("<[^>]*>|!\\[[^\\]]*\\]\\([^)]*\\)|\\*\\*"; "") | gsub("^ +| +$"; "")) as $title
                | "- id=\($f.id) priority=\($p) \($f.path):\($f.line // $f.original_line // "?") — \($title)"
                , ( [ $all[] | select(.in_reply_to_id == $f.id and .user.login == env.AUTHOR) ] | sort_by(.created_at)
                    | if length == 0 then "    author reply: none" else .[] | "    author reply [\(.created_at)]: \(.body | gsub("\n"; " ") | .[0:400])" end )
                end'
            echo
            echo "## Inline review comments on this PR created after the head commit (all authors; replies included)"
            gh api "repos/$REPO/pulls/$PR/comments" --paginate \
              --jq '[.[] | select(.created_at > env.HEAD_DATE)] | sort_by(.created_at) | .[] | "\n- [\(.created_at)] \(.user.login) on \(.path):\(.line // .original_line // "?")\(if .in_reply_to_id then " (reply to \(.in_reply_to_id))" else "" end) id=\(.id)\n  \(.body | gsub("\n"; "\n  "))"'
            echo
            echo "## Issue comments on this PR created after the head commit (all authors)"
            gh api "repos/$REPO/issues/$PR/comments" --paginate \
              --jq '[.[] | select(.created_at > env.HEAD_DATE)] | sort_by(.created_at) | .[] | "\n- [\(.created_at)] \(.user.login):\n  \(.body | gsub("\n"; "\n  "))"'
            echo
            echo "## Head age: $(( ( $(date +%s) - $(date -d "$HEAD_DATE" +%s) ) / 60 )) minutes since the head commit"
            echo
            echo "## Reactions on the PR (👍 from Codex after the head commit = automatic clean verdict; 👀 = a review is still running)"
            gh api "repos/$REPO/issues/$PR/reactions" --paginate \
              --jq '.[] | "- [\(.created_at)] \(.user.login): \(.content)\(if .created_at > env.HEAD_DATE then "  (after head commit)" else "  (BEFORE head commit — stale)" end)"'
            echo
            echo "## Previous gate verdicts on this head"
            gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
              --jq '[.[] | select(.user.login==env.GATE and .commit_id==env.HEAD)] | .[] | "- \(.submitted_at) \(.state): \(.body)"'
          } > gate/context.md
          echo "HEAD=$HEAD" >> "$GITHUB_ENV"
          wc -c gate/context.md

      - name: Decide
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}   # skip the Claude GitHub App / OIDC exchange
          # Runs are triggered by Codex's own reviews/comments and by the schedule.
          allowed_bots: "chatgpt-codex-connector,github-actions"
          claude_args: |
            --model claude-haiku-4-5
            --max-turns 6
            --allowedTools "Read,Write,Glob,Grep,Bash(gh pr diff:*)"
          prompt: |
            You are the merge gate for pull request #${{ matrix.pr }} in ${{ github.repository }}.
            Read `gate/context.md` (all the automated-review material for the PR's
            current head commit) and, only if you need it, `gh pr diff ${{ matrix.pr }}`
            and `AGENTS.md`. Then write your decision to `gate/verdict.json` as
            `{"verdict": "APPROVE" | "REQUEST_CHANGES" | "UNSURE", "reason": "<one or two sentences>"}`
            and stop. Do not post comments, do not edit other files.

            How the automated reviewer (Codex, login chatgpt-codex-connector[bot]) behaves:
            it reviews every push. When it has findings it submits a review pinned to
            the head commit with inline comments, each usually carrying a priority
            badge (P0/P1/P2). When it has nothing to flag it submits no review; an
            automatic review then leaves a 👍 reaction on the PR, and a manually
            requested review posts an issue comment saying, in some wording, that it
            found no major issues. Only signals dated after the head commit count.
            Wording and formatting may vary between versions; judge the meaning.

            Severity policy: a finding's priority is the badge Codex put on it (P0, P1,
            P2, P3); the section "Codex findings on this head" lists each finding with
            its priority and the PR author's replies on its thread. P0 and P1 block.
            P2 and P3 do not block: they are follow-ups, and the author answers each
            one on its thread — declined as out of scope, not applicable, or already
            covered, or deferred to a follow-up issue — or fixes it, which produces a
            new head. A finding with no badge counts as blocking.

            Decision rules:
            - UNSURE first: if a Codex 👀 reaction is present, or the head commit is
              less than 8 minutes old and the only clean signal is a reaction or
              comment, a review may still be running for this head and an earlier
              clean signal may belong to a previous push. Also UNSURE when you cannot
              tell what Codex concluded about this head (only a "task started" or
              acknowledgement comment, a review whose commit differs from the head,
              contradictory material). Say why.
            - REQUEST_CHANGES when the latest Codex review on this head has at least
              one P0/P1 (or unbadged) finding. Replies or rebuttals by the author do
              NOT lift that block: only a later clean Codex signal for this head does
              — a re-review the author requested on the same head, or Codex's review
              of a new head. Name the blocking findings in the reason.
            - REQUEST_CHANGES also when every finding on this head is P2/P3 but at
              least one has no author reply yet, or the author's reply on one says or
              implies a fix is coming ("fixed in …", "will address", "on it"): a push
              is expected, so this head is not the one to approve. Say which threads
              are waiting in the reason; this verdict is replaced when the author
              answers.
            - APPROVE when Codex's latest signal for THIS head is clean — a 👍
              reaction or a "no major issues" comment dated after the head commit, or
              a review on this head with zero inline findings — and no later Codex
              review on this head carries findings.
            - APPROVE also when the latest Codex review on this head has findings,
              none is P0/P1 or unbadged, and every P2/P3 finding carries an author
              reply that states a reason for not changing the code on this PR (scope,
              spec, not applicable, follow-up issue). A bare acknowledgement or
              reaction is not an answer. Quote the threads and the reasons in one
              line each.
            Never approve because the material is empty or ambiguous.

      - name: Post the verdict as github-actions[bot]
        run: |
          set -euo pipefail
          [ -s gate/verdict.json ] || { echo "::error::no verdict written by the model"; exit 1; }
          verdict=$(jq -r .verdict gate/verdict.json)
          reason=$(jq -r .reason gate/verdict.json)
          echo "verdict: $verdict — $reason"
          case "$verdict" in
            APPROVE|REQUEST_CHANGES) ;;
            UNSURE) echo "::warning::gate unsure for PR #$PR: $reason"; exit 0 ;;
            *) echo "::error::invalid verdict '$verdict'"; exit 1 ;;
          esac
          # The head can move while the model is judging: the author pushes a fix
          # seconds after the review that selected this run. Posting anyway pins a
          # verdict to a commit nobody is on, and the review-set change costs the
          # author another continuation turn. Re-read the head and drop the verdict.
          live=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          if [ "$live" != "$HEAD" ]; then
            echo "::notice::head moved $HEAD -> $live while judging; dropping stale verdict"
            exit 0
          fi
          current=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq '[.[] | select(.user.login==env.GATE and .commit_id==env.HEAD)] | sort_by(.submitted_at) | last | .state // empty')
          state="CHANGES_REQUESTED"; [ "$verdict" = APPROVE ] && state="APPROVED"
          if [ "$current" = "$state" ]; then echo "already $state for $HEAD"; exit 0; fi
          gh api -X POST "repos/$REPO/pulls/$PR/reviews" -f event="$verdict" -f commit_id="$HEAD" \
            -f body="codex-gate ($verdict on $HEAD): $reason" >/dev/null
          echo "posted $verdict"
