# Turn Codex's automated review into a review decision the orchestrator can act
# on. Codex (chatgpt-codex-connector[bot]) posts comment-only reviews; this job
# reads the latest Codex review for the PR's head commit and submits, as
# github-actions[bot], REQUEST_CHANGES when it carries any inline finding and
# APPROVE when it carries none (a clean re-review after a push is the merge
# signal). With a ruleset requiring one approval on main,
# that is what moves `reviewDecision` from REVIEW_REQUIRED to APPROVED.
#
# Requires the repository setting "Allow GitHub Actions to create and approve
# pull requests" (Settings → Actions → General → Workflow permissions).
name: codex-gate

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate
        required: true

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: codex-gate-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    # On review events, only act on Codex's own reviews; everything else is noise.
    if: >-
      github.event_name != 'pull_request_review' ||
      github.event.review.user.login == 'chatgpt-codex-connector[bot]'
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      REVIEWER: chatgpt-codex-connector[bot]
    steps:
      - name: Evaluate the latest Codex review for the head commit
        run: |
          set -euo pipefail
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          export HEAD="$head"
          echo "head: $head"

          # Latest Codex review whose commit matches the current head.
          review_id=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq '[.[] | select(.user.login==env.REVIEWER and .commit_id==env.HEAD)] | sort_by(.submitted_at) | last | .id // empty')
          if [ -z "$review_id" ]; then
            echo "no Codex review for head $head yet; leaving the review decision unchanged"
            exit 0
          fi
          echo "codex review: $review_id"

          # Any inline finding blocks; Codex only posts what it considers worth fixing.
          blocking=$(gh api "repos/$REPO/pulls/$PR/reviews/$review_id/comments" --paginate --jq 'length')
          echo "findings: $blocking"

          # Skip if github-actions already posted the same verdict for this head.
          mine=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq '[.[] | select(.user.login=="github-actions[bot]" and .commit_id==env.HEAD)] | sort_by(.submitted_at) | last | .state // empty')
          if [ "$blocking" -gt 0 ]; then
            [ "$mine" = "CHANGES_REQUESTED" ] && { echo "already requested changes for $head"; exit 0; }
            gh api -X POST "repos/$REPO/pulls/$PR/reviews" -f event=REQUEST_CHANGES -f commit_id="$head" \
              -f body="codex-gate: Codex left $blocking finding(s) on $head. Fix each one, or reply on its thread with why it does not apply, then push; the gate re-evaluates on the next Codex review." >/dev/null
            echo "-> REQUEST_CHANGES"
          else
            [ "$mine" = "APPROVED" ] && { echo "already approved $head"; exit 0; }
            gh api -X POST "repos/$REPO/pulls/$PR/reviews" -f event=APPROVE -f commit_id="$head" \
              -f body="codex-gate: Codex review $review_id on $head reports no findings." >/dev/null
            echo "-> APPROVE"
          fi
