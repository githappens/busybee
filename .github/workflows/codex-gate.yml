# Merge gate: turn Codex's automated review into a review decision.
#
# Codex (chatgpt-codex-connector[bot]) reviews every push but never approves or
# requests changes. With findings it posts a review pinned to the head commit;
# with nothing to flag it reacts 👍 on the PR (automatic review) or posts a
# "no major issues" comment (manual @codex review). This workflow
#
#   1. selects (deterministically) the open PRs where Codex has said something
#      about the current head commit that the gate has not yet judged,
#   2. has a small Claude model read that material and decide APPROVE,
#      REQUEST_CHANGES, or UNSURE (the model never holds the review token), and
#   3. posts the verdict as github-actions[bot]. UNSURE posts nothing, so the
#      PR waits for a human instead of the gate guessing.
#
# Severity policy. Codex tags each finding P0/P1/P2 (P3 exists in principle).
# Only P0/P1 block, and a block lifts only on a later clean Codex signal for
# the head. A P2/P3 finding is a follow-up, not a blocker: the head is approved
# once the author has answered every such thread with a reason (out of scope,
# not applicable, follow-up issue filed). An audit of 49 findings over four PRs
# found every would-have-shipped bug in rounds 1-2 and the P2 tail to be
# cascades from earlier fixes and edge-of-edge cases, one per round, because
# Codex surfaces one or two findings per pass; blocking on them turned a
# 2-round review into 11.
#
# With the ruleset on main requiring one approval (dismissed on push), the
# verdict is what moves `reviewDecision`, which the orchestrator's auto-merge
# reads. Requires the repository setting "Allow GitHub Actions to create and
# approve pull requests" and the CLAUDE_CODE_OAUTH_TOKEN secret.
name: codex-gate

on:
  schedule:
    - cron: "*/5 * * * *"
  pull_request:
    types: [synchronize]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate (empty = all open PRs)
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: codex-gate
  cancel-in-progress: false

env:
  REVIEWER: chatgpt-codex-connector[bot]
  GATE: github-actions[bot]

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.pick.outputs.prs }}
    steps:
      # The status predicate is infrastructure, so always load the base copy.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      # Before this script lands on main, PRs that change the workflow still run
      # it; bootstrap from the triggering merge commit for that bootstrap window.
      - name: Bootstrap review-status when not yet on main
        run: |
          if [ -f sortie/review-status.sh ]; then
            exit 0
          fi
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout FETCH_HEAD -- sortie/review-status.sh
          chmod +x sortie/review-status.sh

      - name: Find PRs with unjudged Codex activity on their head commit
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Only a manual dispatch narrows to one PR. Event runs evaluate every open
          # PR: a clean Codex verdict is a reaction, which raises no event of its own,
          # and the cron trigger is throttled on quiet repositories.
          ONLY_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          if [ -n "$ONLY_PR" ] && gh api "repos/$REPO/pulls/$ONLY_PR" --jq .state 2>/dev/null | grep -q open; then
            prs="$ONLY_PR"
          else
            prs=$(gh pr list --repo "$REPO" --state open --limit 100 --json number --jq '.[].number')
          fi
          picked=()
          for PR in $prs; do
            status=$(sortie/review-status.sh "$PR")
            case "$status" in
              approvable) desired=APPROVED ;;
              waiting:*|blocked:*) desired=CHANGES_REQUESTED ;;
              unknown:classify-comment-*|unknown:judge-replies)
                echo "PR #$PR: $status -> judge Codex's wording"
                picked+=("$PR")
                continue
                ;;
              unknown:*)
                echo "PR #$PR: $status -> wait"
                continue
                ;;
              *)
                echo "::error::review-status returned invalid state '$status' for PR #$PR"
                exit 1
                ;;
            esac

            HEAD=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
            export HEAD
            current=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate | jq -s 'add // []' | jq -r '
              [.[] | select(.user.login==env.GATE and .commit_id==env.HEAD)]
              | sort_by(.submitted_at) | last | .state // empty')
            if [ "$current" = "$desired" ]; then
              echo "PR #$PR: $status, already $desired"
            else
              echo "PR #$PR: $status, current ${current:-none} -> judge"
              picked+=("$PR")
            fi
          done
          printf 'prs=%s\n' "$(printf '%s\n' "${picked[@]:-}" | grep -v '^$' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  judge:
    needs: select
    if: needs.select.outputs.prs != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.select.outputs.prs) }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ matrix.pr }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Bootstrap review-status when not yet on main
        run: |
          if [ -f sortie/review-status.sh ]; then
            exit 0
          fi
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout FETCH_HEAD -- sortie/review-status.sh
          chmod +x sortie/review-status.sh

      - name: Collect the review material for the head commit
        run: |
          set -euo pipefail
          mkdir -p gate
          HEAD=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          status=$(sortie/review-status.sh -v "$PR" 2>gate/evidence.txt)
          printf '%s\n' "$status" > gate/status.txt
          {
            echo "# PR #$PR — review material for head $HEAD"
            echo
            gh api "repos/$REPO/pulls/$PR" --jq '"Title: \(.title)\nAuthor: \(.user.login)\nBranch: \(.head.ref) -> \(.base.ref)\n\n## PR description\n\(.body // "(none)")"'
            echo
            echo "## Mechanical review status"
            cat gate/status.txt
            echo
            echo "## Evidence from sortie/review-status.sh"
            cat gate/evidence.txt
          } > gate/context.md
          echo "HEAD=$HEAD" >> "$GITHUB_ENV"
          wc -c gate/context.md

      - name: Decide
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}   # skip the Claude GitHub App / OIDC exchange
          # Runs are triggered by Codex's own reviews/comments and by the schedule.
          allowed_bots: "chatgpt-codex-connector,github-actions"
          claude_args: |
            --model claude-haiku-4-5
            --max-turns 3
            --allowedTools "Read,Write,Glob,Grep,Bash(gh pr diff:*)"
          prompt: |
            You are the merge gate for pull request #${{ matrix.pr }} in ${{ github.repository }}.
            Read `gate/context.md` (all the automated-review material for the PR's
            current head commit) and, only if you need it, `gh pr diff ${{ matrix.pr }}`
            and `AGENTS.md`. Then write your decision to `gate/verdict.json` as
            `{"verdict": "APPROVE" | "REQUEST_CHANGES" | "UNSURE", "reason": "<one or two sentences>"}`
            and stop. Do not post comments, do not edit other files.

            `sortie/review-status.sh` is authoritative for commit pinning,
            priorities, reply presence, signal age and once-per-head bookkeeping.
            Do not recompute those facts. Map `blocked:<ids>` and `waiting:<ids>` to
            REQUEST_CHANGES, and map `approvable` to APPROVE.

            Two wording judgements remain yours:
            - For `unknown:classify-comment-<ids>`, APPROVE only when the listed
              Codex comment says, despite variable wording, that its review found no
              major issues. A task-started message, acknowledgement or ambiguous
              comment is UNSURE.
            - Before approving answered P2/P3 findings, require each author reply to
              state a reason for not changing this PR (scope, spec, not applicable,
              or a linked follow-up). A bare acknowledgement, or a promise that a fix
              is coming, is REQUEST_CHANGES. For `unknown:judge-replies`, apply this
              check to every active P2/P3 finding listed in the evidence.

            Any other `unknown:*` state is UNSURE. Never approve empty or ambiguous
            material.

      - name: Post the verdict as github-actions[bot]
        run: |
          set -euo pipefail
          [ -s gate/verdict.json ] || { echo "::error::no verdict written by the model"; exit 1; }
          verdict=$(jq -r .verdict gate/verdict.json)
          reason=$(jq -r .reason gate/verdict.json)
          echo "verdict: $verdict — $reason"
          case "$verdict" in
            APPROVE|REQUEST_CHANGES) ;;
            UNSURE) echo "::warning::gate unsure for PR #$PR: $reason"; exit 0 ;;
            *) echo "::error::invalid verdict '$verdict'"; exit 1 ;;
          esac
          # The head can move while the model is judging: the author pushes a fix
          # seconds after the review that selected this run. Posting anyway pins a
          # verdict to a commit nobody is on, and the review-set change costs the
          # author another continuation turn. Re-read the head and drop the verdict.
          live=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          if [ "$live" != "$HEAD" ]; then
            echo "::notice::head moved $HEAD -> $live while judging; dropping stale verdict"
            exit 0
          fi
          current=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate | jq -s 'add // []' | jq -r '
            [.[] | select(.user.login==env.GATE and .commit_id==env.HEAD)]
            | sort_by(.submitted_at) | last | .state // empty')
          state="CHANGES_REQUESTED"; [ "$verdict" = APPROVE ] && state="APPROVED"
          if [ "$current" = "$state" ]; then echo "already $state for $HEAD"; exit 0; fi
          gh api -X POST "repos/$REPO/pulls/$PR/reviews" -f event="$verdict" -f commit_id="$HEAD" \
            -f body="codex-gate ($verdict on $HEAD): $reason" >/dev/null
          echo "posted $verdict"
