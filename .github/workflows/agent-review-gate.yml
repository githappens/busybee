name: agent-review-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: PR number (empty checks all open lab PRs)
        required: false

permissions:
  contents: read
  checks: read
  pull-requests: write
  issues: read

concurrency:
  group: agent-review-gate
  cancel-in-progress: false

jobs:
  gate:
    # A candidate branch must never supply executable approval policy, even
    # when someone dispatches this workflow manually on a non-default ref.
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check current-head skill reports and CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ONLY_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          if [ -n "$ONLY_PR" ]; then
            [[ "$ONLY_PR" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid PR number' >&2; exit 2; }
            prs=$ONLY_PR
          else
            prs=$(gh pr list --repo "$REPO" --state open --limit 100 --json number --jq '.[].number')
          fi
          for pr in $prs; do
            python3 sortie/reviews.py gate --repo "$REPO" --pr "$pr" --apply
          done
