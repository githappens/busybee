# Temporary: measures the #130 static drain on the hosted macOS runner. Not for merge.
name: diag-130

on:
  push:
    branches: [hand/130-diag]

env:
  CARGO_TERM_COLOR: never
  PUEUE_VERSION: "4.0.4"
  MAKE_VERSION: "4.4.1"

jobs:
  loop:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> build"
      - name: Install pueued
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/pueued" \
            "https://github.com/Nukesor/pueue/releases/download/v$PUEUE_VERSION/pueued-aarch64-apple-darwin"
          chmod +x "$HOME/.local/bin/pueued"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install GNU make
        run: |
          set -euo pipefail
          prefix="$HOME/.local/gnumake"
          curl -fsSL "https://ftp.gnu.org/gnu/make/make-$MAKE_VERSION.tar.gz" | tar xz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/make-$MAKE_VERSION"
          ./configure --prefix="$prefix" --quiet
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make install
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          sysctl -n hw.ncpu hw.perflevel0.logicalcpu hw.perflevel1.logicalcpu 2>/dev/null || true
          cargo build --workspace --bins
          cargo test -p bzb --test e2e_pool --no-run
      - name: Loop the whole e2e_pool binary
        run: |
          bin=$(ls build/debug/deps/e2e_pool-* | grep -v '\.d$' | head -1)
          for i in $(seq 1 10); do
            if "$bin" --nocapture > run.log 2>&1; then r=pass; else r=FAIL; fi
            echo "binary $i $r $(grep -h 'DIAG drain lease=3' run.log | grep 'drain_target=2' | sed -E 's/.*drained=Ok\(([0-9])\).*elapsed_ms=([0-9]+).*/got=\1 ms=\2/' | tr '\n' ' ')"
            grep -E 'panicked|left:' run.log | head -4
          done
      - name: Full workspace test runs
        run: |
          for i in 1 2 3; do
            if cargo test --workspace -- --nocapture > ws.log 2>&1; then r=pass; else r=FAIL; fi
            echo "workspace $i $r three-way drain: $(grep -h 'DIAG drain lease=3' ws.log | grep 'drain_target=2' | sed -E 's/.*drained=Ok\(([0-9])\).*elapsed_ms=([0-9]+).*/got=\1 ms=\2/' | tr '\n' ' ')"
            grep -E 'panicked at|^test .* FAILED' ws.log | head -6
          done
