# Temporary: measures the #130 static drain on the hosted macOS runner. Not for merge.
name: diag-130

on:
  push:
    branches: [hand/130-diag]

env:
  CARGO_TERM_COLOR: never
  PUEUE_VERSION: "4.0.4"
  MAKE_VERSION: "4.4.1"

jobs:
  loop:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> build"
      - name: Install pueued
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/pueued" \
            "https://github.com/Nukesor/pueue/releases/download/v$PUEUE_VERSION/pueued-aarch64-apple-darwin"
          chmod +x "$HOME/.local/bin/pueued"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install GNU make
        run: |
          set -euo pipefail
          prefix="$HOME/.local/gnumake"
          curl -fsSL "https://ftp.gnu.org/gnu/make/make-$MAKE_VERSION.tar.gz" | tar xz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/make-$MAKE_VERSION"
          ./configure --prefix="$prefix" --quiet
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make install
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          sysctl -n hw.ncpu hw.perflevel0.logicalcpu hw.perflevel1.logicalcpu 2>/dev/null || true
          cargo build --workspace --bins
          cargo test -p bzb --test e2e_pool --no-run
      - name: Loop
        run: |
          bin=$(ls build/debug/deps/e2e_pool-* | grep -v '\.d$' | head -1)
          for variant in base qos base qos base qos; do
            for i in $(seq 1 10); do
              if [ "$variant" = qos ]; then export DIAG_QOS=1; else unset DIAG_QOS; fi
              if "$bin" a_static_task_beside_two_builds_gets_a_third_of_the_pool --exact --nocapture > run.log 2>&1; then r=pass; else r=FAIL; fi
              echo "$variant $i $r $(grep -h 'DIAG drain lease=3' run.log | sed -E 's/.*drained=Ok\(([0-9])\).*elapsed_ms=([0-9]+).*/got=\1 ms=\2/')"
            done
          done | tee results.txt
          for v in base qos; do echo "$v: $(grep -c "^$v .* pass" results.txt) pass / $(grep -c "^$v " results.txt)"; done
