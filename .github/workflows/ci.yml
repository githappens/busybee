# Format, lint and test on both target platforms; both jobs are required checks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # pueue-lib 0.31 speaks the 4.x protocol; a release binary avoids compiling a test fixture.
  PUEUE_VERSION: "4.0.4"
  # The jobserver tests need make >= 4.4's fifo jobserver; neither runner image ships it.
  MAKE_VERSION: "4.4.1"

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pueued_asset: pueued-x86_64-unknown-linux-musl
          - os: macos-latest
            pueued_asset: pueued-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - name: Show the active toolchain
        # rustup installs the rust-toolchain.toml channel if missing.
        run: |
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          # .cargo/config.toml redirects the target dir to build/.
          workspaces: ". -> build"

      - name: Install pueued ${{ env.PUEUE_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/pueued" \
            "https://github.com/Nukesor/pueue/releases/download/v$PUEUE_VERSION/${{ matrix.pueued_asset }}"
          chmod +x "$HOME/.local/bin/pueued"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache GNU make ${{ env.MAKE_VERSION }}
        uses: actions/cache@v6
        with:
          path: ~/.local/gnumake
          key: gnumake-${{ env.MAKE_VERSION }}-${{ matrix.os }}

      - name: Install GNU make ${{ env.MAKE_VERSION }}
        # From source: no package pins the version on both platforms.
        run: |
          set -euo pipefail
          prefix="$HOME/.local/gnumake"
          if [ ! -x "$prefix/bin/make" ]; then
            curl -fsSL "https://ftp.gnu.org/gnu/make/make-$MAKE_VERSION.tar.gz" \
              | tar xz -C "$RUNNER_TEMP"
            cd "$RUNNER_TEMP/make-$MAKE_VERSION"
            ./configure --prefix="$prefix" --quiet
            make -j"$(getconf _NPROCESSORS_ONLN)"
            make install
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Assert tool versions
        # Fail loudly on a downgrade instead of silently skipping tests (ninja is from the image).
        run: |
          set -euo pipefail
          atleast() { # atleast <tool> <minimum> <actual>
            if [ "$(printf '%s\n%s\n' "$2" "$3" | sort -V | head -1)" != "$2" ]; then
              echo "$1 $3 is older than the required $2" >&2
              exit 1
            fi
            echo "$1 $3 (>= $2)"
          }
          atleast make 4.4 "$(make --version | sed -n '1s/^GNU Make //p')"
          atleast ninja 1.13 "$(ninja --version)"
          atleast pueued 4.0 "$(pueued --version | awk '{print $2}')"

      - run: cargo fmt --all --check

      - name: Check agent harness
        run: |
          python3 -m unittest discover -s sortie/tests
          python3 -m unittest discover -s scripts/vm/tests
          python3 -m unittest discover -s tests/scenarios/tests
          bash sortie/test-machine-safety-hook.sh
          bash sortie/test-harness-docs.sh

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace
