# Format, lint and test on both target platforms; both jobs are required checks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # pueue-lib 0.31 speaks the 4.x protocol; a release binary avoids compiling a test fixture.
  PUEUE_VERSION: "4.0.4"
  # The jobserver tests need make >= 4.4's fifo jobserver; neither runner image ships it.
  MAKE_VERSION: "4.4.1"
  # The VM lab renders terminal recordings on the host (scripts/vm/screen.py)
  # with these; the development shell pins the same versions through nixpkgs.
  PYTHON_VERSION: "3.13"
  PYTE_VERSION: "0.8.2"
  PILLOW_VERSION: "12.1.1"
  FONTTOOLS_VERSION: "4.61.1"
  AGG_VERSION: "1.7.0"
  DEJAVU_VERSION: "2.37"

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            pueue_target: aarch64-apple-darwin
            agg_asset: agg-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - name: Show the active toolchain
        # rustup installs the rust-toolchain.toml channel if missing.
        run: |
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          # .cargo/config.toml redirects the target dir to build/.
          workspaces: ". -> build"

      - name: Install pueued and pueue ${{ env.PUEUE_VERSION }}
        # The client is for the agent harness's real launcher test.
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          for tool in pueued pueue; do
            curl -fsSL -o "$HOME/.local/bin/$tool" \
              "https://github.com/Nukesor/pueue/releases/download/v$PUEUE_VERSION/$tool-${{ matrix.pueue_target }}"
            chmod +x "$HOME/.local/bin/$tool"
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache GNU make ${{ env.MAKE_VERSION }}
        uses: actions/cache@v6
        with:
          path: ~/.local/gnumake
          key: gnumake-${{ env.MAKE_VERSION }}-${{ matrix.os }}

      - name: Install GNU make ${{ env.MAKE_VERSION }}
        # From source: no package pins the version on both platforms.
        run: |
          set -euo pipefail
          prefix="$HOME/.local/gnumake"
          if [ ! -x "$prefix/bin/make" ]; then
            curl -fsSL "https://ftp.gnu.org/gnu/make/make-$MAKE_VERSION.tar.gz" \
              | tar xz -C "$RUNNER_TEMP"
            cd "$RUNNER_TEMP/make-$MAKE_VERSION"
            ./configure --prefix="$prefix" --quiet
            make -j"$(getconf _NPROCESSORS_ONLN)"
            make install
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Assert tool versions
        # Fail loudly on a downgrade instead of silently skipping tests (ninja is from the image).
        run: |
          set -euo pipefail
          atleast() { # atleast <tool> <minimum> <actual>
            if [ "$(printf '%s\n%s\n' "$2" "$3" | sort -V | head -1)" != "$2" ]; then
              echo "$1 $3 is older than the required $2" >&2
              exit 1
            fi
            echo "$1 $3 (>= $2)"
          }
          atleast make 4.4 "$(make --version | sed -n '1s/^GNU Make //p')"
          atleast ninja 1.13 "$(ninja --version)"
          atleast pueued 4.0 "$(pueued --version | awk '{print $2}')"
          atleast pueue 4.0 "$(pueue --version | awk '{print $2}')"

      - name: Drain diagnostics
        run: |
          set -x
          ps -o pid,ppid,pri,ni,comm -p $$ -p $PPID || true
          sysctl -n hw.ncpu machdep.cpu.brand_string || true
          cargo build -q --workspace
          for mode in lib lib spin; do
            case $mode in spin) export SPIN=pure;; *) unset SPIN;; esac
            HOGS=0 cargo test -q -p bzb-core --test zz_exp -- --ignored --nocapture 2>&1 | grep RESULT || true
          done
          HOGS=3 cargo test -q -p bzb-core --test zz_exp -- --ignored --nocapture 2>&1 | grep RESULT || true
          cargo test -q -p bzb-core --test jobserver_contention 2>&1 | grep -E 'test result|short' || true
          for i in 1 2 3; do cargo test -q -p bzb --test e2e_pool 2>&1 | grep -E 'test result|left:' || true; done
