[package]
name = "bzb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Core library for busybee: the pueued client, the bzbd protocol, and the classification, scheduling and config logic."
repository = "https://github.com/githappens/busybee"
homepage = "https://github.com/githappens/busybee"
keywords = ["queue", "pueue", "scheduler", "task", "async"]
categories = ["asynchronous", "command-line-utilities"]
readme = "../../README.md"

[dependencies]
thiserror.workspace = true
tokio.workspace = true
pueue-lib.workspace = true
snap.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
bzb-test-support = { path = "../bzb-test-support" }
serial_test = "3"
tempfile = "3"
# `test-util` for `#[tokio::test(start_paused = true)]`: tests that assert a
# timeout fires do it on a paused clock rather than by waiting out the budget.
tokio = { workspace = true, features = ["test-util"] }
