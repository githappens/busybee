[package]
name = "bzb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Core library for bzb — async helpers for talking to pueued, enqueuing tasks, streaming logs, and snapshotting queue state."
repository = "https://github.com/githappens/busybee"
homepage = "https://github.com/githappens/busybee"
keywords = ["queue", "pueue", "scheduler", "task", "async"]
categories = ["asynchronous", "command-line-utilities"]
readme = "../../README.md"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
pueue-lib.workspace = true
snap.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
bzb-test-support = { path = "../bzb-test-support" }
chrono = "0.4"
serial_test = "3"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
# `test-util` for `#[tokio::test(start_paused = true)]`: tests that assert a
# timeout fires do it on a paused clock rather than by waiting out the budget.
tokio = { workspace = true, features = ["test-util"] }
toml = "0.8"
